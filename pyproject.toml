[project]
name = "incubator-telemetry-analysis"
version = "0.1.0"
description = "Analysis of real queen-bee incubator telemetry: features, anomalies, thermal model fit"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
